name: Build Brivo Wear OS AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/dist
          rm -rf android/app/src/main/assets/dist/*
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab)
        working-directory: ./android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload .AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brivo-wearos-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
